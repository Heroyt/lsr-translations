name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        testbench: ['^10.0', '^11.0']
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, gettext, iconv, libxml, mbstring, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Generate test locales
        run: sudo locale-gen cs_CZ.UTF-8 de_DE.UTF-8 en_US.UTF-8
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "orchestra/testbench:${{ matrix.testbench }}"
      - name: CS
        run: composer cs
      - name: PHPStan
        run: composer phpstan -- --no-progress --memory-limit=1G
      - name: PHPUnit
        run: composer test -- --no-coverage --fail-on-skipped
